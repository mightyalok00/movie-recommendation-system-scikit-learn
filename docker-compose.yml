version: '3.8'

services:
  fastapi-service:
    build: .
    container_name: movielens-fastapi
    ports:
      - "8000:8000"
    environment:
      - MOVIELENS_DATA_DIR=/data/ml-32m
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
