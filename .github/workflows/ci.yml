name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate question coverage
        run: python scripts/validate_question_coverage.py
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run dataset-independent unit and API tests
        run: python main.py test
      - name: Validate CLI
        run: python main.py --help
      - name: Download MovieLens small dataset for benchmark smoke test
        run: python main.py download-data --dataset ml-latest-small --output data/

      - name: Benchmark smoke test
        run: python main.py benchmark --max-ratings 5000
