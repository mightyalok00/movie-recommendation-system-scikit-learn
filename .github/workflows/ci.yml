name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate canonical 105-question coverage
        run: python scripts/validate_question_coverage.py

      - name: Critical Ruff static checks
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=src,data -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=50
          python -m coverage xml

      - name: Validate CLI
        run: python main.py --help

      - name: Validate YData profiling CLI
        run: python scripts/profile_dataset.py --help

      - name: Download MovieLens small dataset for benchmark smoke test
        run: python main.py download-data --dataset ml-latest-small --output data/

      - name: Benchmark smoke test
        run: python main.py benchmark --max-ratings 5000

      - name: Docker build smoke test
        run: docker build -t movielens-recommender:ci .
