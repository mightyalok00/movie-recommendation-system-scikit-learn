name: YData Profiling

on:
  workflow_dispatch:
    inputs:
      ratings_sample:
        description: "Maximum ratings rows to profile"
        required: false
        default: "100000"
        type: string
      tags_sample:
        description: "Maximum tag rows to profile"
        required: false
        default: "100000"
        type: string

permissions:
  contents: write

jobs:
  profile:
    name: Generate YData HTML reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install profiling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Download MovieLens 32M
        run: |
          curl -L --fail --retry 3 \
            -o movielens-32m.zip \
            https://files.grouplens.org/datasets/movielens/ml-32m.zip
          unzip -q movielens-32m.zip -d .
          test -f ml-32m/ratings.csv
          test -f ml-32m/movies.csv
          test -f ml-32m/tags.csv
          test -f ml-32m/links.csv

      - name: Generate YData Profiling reports
        run: |
          python scripts/profile_dataset.py \
            --data-dir ml-32m \
            --output-dir reports/ydata \
            --ratings-sample ${{ inputs.ratings_sample }} \
            --tags-sample ${{ inputs.tags_sample }}

      - name: Commit YData reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ydata/
          if git diff --cached --quiet; then
            echo "No YData report changes to commit."
          else
            git commit -m "data: add YData profiling reports"
            git push
          fi

      - name: Upload YData reports
        uses: actions/upload-artifact@v5
        with:
          name: ydata-profiling-reports
          path: reports/ydata/
          if-no-files-found: error
          retention-days: 14
